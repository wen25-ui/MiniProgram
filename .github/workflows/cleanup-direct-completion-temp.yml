name: Cleanup direct completion temporary resources

on:
  pull_request:
    branches: [Git_hub]
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/trigger-direct-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Git_hub
          fetch-depth: 0

      - name: Remove cleanup workflow from Git_hub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/cleanup-direct-completion-temp.yml
          git add -A
          git commit -m "cleanup temporary patch resources [skip ci]"
          git push origin HEAD:Git_hub

      - name: Close temporary PR and delete temporary branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          git push origin --delete agent/direct-completion-candidate || true
          git push origin --delete agent/trigger-direct-completion || true
