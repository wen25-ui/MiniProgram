name: Apply direct completion flow

on:
  push:
    branches: [Git_hub]
    paths:
      - .github/workflows/apply-direct-completion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Git_hub
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Apply direct completion changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}: {pattern}')
              write(path, updated)

          server = 'server/src/index.js'

          # Remove the obsolete customer-service verification read APIs and action route.
          regex_once(
              server,
              r"\nasync function customerVerifications\(req, res, category\) \{.*?\nasync function customerAction",
              "\nasync function customerAction"
          )
          replace_once(
              server,
              "    if (req.method === 'GET' && url.pathname === '/v1/customer/verifications') return await customerVerifications(req, res, url.searchParams.get('category'))\n    const customerVerificationMatch = url.pathname.match(/^\\/v1\\/customer\\/verifications\\/([\\w-]+)$/)\n    if (req.method === 'GET' && customerVerificationMatch) return await customerVerificationDetail(req, res, customerVerificationMatch[1])\n",
              ""
          )
          replace_once(
              server,
              "(start-contact|contact-result|verify-info|intention|correct-info|service-type|review|retry-contact|service-mode|confirm-appointment|dispatch|assign-store|start-store|submit-store|service-fail|verify)",
              "(start-contact|contact-result|verify-info|intention|correct-info|service-type|review|retry-contact|service-mode|confirm-appointment|dispatch|assign-store|start-store|submit-store|service-fail)"
          )

          # Legacy store flow now completes immediately after the result is submitted.
          replace_once(
              server,
              "  } else if (action === 'submit-store') {\n    const [[managedTask]] = await connection.execute('SELECT id FROM application_tasks WHERE application_id = ?', [id])\n    if (managedTask) throw Object.assign(new Error('该订单已启用新版任务流程，请由网点工作人员上传结果'), { status: 409 })\n    if (!String(body.voucherRemark || '').trim()) throw Object.assign(new Error('请填写营业厅办理结果与凭证说明'), { status: 400 })\n    if (current.service_mode !== 'STORE_SERVICE' || !['PROCESSING', 'VERIFICATION_RETURNED'].includes(current.status)) throw Object.assign(new Error('当前申请不能提交营业厅办理凭证'), { status: 409 })\n    await changeStatus(id, current.status, 'PENDING_VERIFICATION', 'STORE_FULFILLMENT_SUBMITTED', user, null, {}, connection)\n    await connection.execute('INSERT INTO fulfillment_submissions (application_id, submitted_by_user_id, identity_verified, voucher_remark) VALUES (?, ?, 1, ?)', [id, user.id, body.voucherRemark.trim()])\n",
              "  } else if (action === 'submit-store') {\n    const [[managedTask]] = await connection.execute('SELECT id FROM application_tasks WHERE application_id = ?', [id])\n    if (managedTask) throw Object.assign(new Error('该订单已启用新版任务流程，请由网点工作人员上传结果'), { status: 409 })\n    if (!String(body.voucherRemark || '').trim()) throw Object.assign(new Error('请填写营业厅办理结果与凭证说明'), { status: 400 })\n    if (current.service_mode !== 'STORE_SERVICE' || current.status !== 'PROCESSING') throw Object.assign(new Error('当前申请不能提交营业厅办理结果'), { status: 409 })\n    await connection.execute('INSERT INTO fulfillment_submissions (application_id, submitted_by_user_id, identity_verified, result_status, result_description, voucher_remark) VALUES (?, ?, 1, \'SUCCESS\', ?, ?)', [id, user.id, body.voucherRemark.trim(), body.voucherRemark.trim()])\n    await changeStatus(id, 'PROCESSING', 'COMPLETED', 'STORE_FULFILLMENT_COMPLETED', user, null, {}, connection)\n"
          )
          regex_once(
              server,
              r"\n  \} else if \(action === 'verify'\) \{.*?\n  \} else throw Object\.assign\(new Error\('未知客服操作'\), \{ status: 404 \}\)",
              "\n  } else throw Object.assign(new Error('未知客服操作'), { status: 404 })"
          )

          # Legacy salesman submission also completes the application immediately.
          replace_once(
              server,
              "      if (action === 'submit') {\n        if (!body.identityVerified) throw Object.assign(new Error('请先确认已完成实名核实'), { status: 400 })\n        if (!String(body.voucherRemark || '').trim()) throw Object.assign(new Error('请填写办理凭证说明'), { status: 400 })\n        if (!['PROCESSING', 'VERIFICATION_RETURNED'].includes(application.status)) {\n          throw Object.assign(new Error('当前申请不能提交凭证'), { status: 409 })\n        }\n        await changeStatus(id, application.status, 'PENDING_VERIFICATION', 'FULFILLMENT_SUBMITTED', user, null, {}, connection)\n        await connection.execute(\n          'INSERT INTO fulfillment_submissions (application_id, salesman_user_id, submitted_by_user_id, identity_verified, voucher_remark) VALUES (?, ?, ?, 1, ?)',\n          [id, user.id, user.id, body.voucherRemark.trim()]\n        )\n",
              "      if (action === 'submit') {\n        if (!body.identityVerified) throw Object.assign(new Error('请先确认已完成实名核实'), { status: 400 })\n        if (!String(body.voucherRemark || '').trim()) throw Object.assign(new Error('请填写办理凭证说明'), { status: 400 })\n        if (application.status !== 'PROCESSING') {\n          throw Object.assign(new Error('当前申请不能提交办理结果'), { status: 409 })\n        }\n        await connection.execute(\n          'INSERT INTO fulfillment_submissions (application_id, salesman_user_id, submitted_by_user_id, identity_verified, result_status, result_description, voucher_remark) VALUES (?, ?, ?, 1, \'SUCCESS\', ?, ?)',\n          [id, user.id, user.id, body.voucherRemark.trim(), body.voucherRemark.trim()]\n        )\n        await changeStatus(id, 'PROCESSING', 'COMPLETED', 'FULFILLMENT_COMPLETED', user, null, {}, connection)\n"
          )

          # Active task lists no longer include verification states.
          replace_once(server, "a.status IN ('ASSIGNED','PROCESSING','VERIFICATION_RETURNED','PENDING_VERIFICATION')", "a.status IN ('ASSIGNED','PROCESSING')")
          replace_once(server, "a.status IN ('ASSIGNED','PROCESSING','VERIFICATION_RETURNED','PENDING_VERIFICATION')", "a.status IN ('ASSIGNED','PROCESSING')")
          replace_once(server, "AND a.status IN ('ASSIGNED', 'PROCESSING', 'VERIFICATION_RETURNED', 'PENDING_VERIFICATION')", "AND a.status IN ('ASSIGNED', 'PROCESSING')")
          replace_once(
              server,
              "  upload: ['WAITING_RESULT_UPLOAD', 'VERIFICATION_RETURNED'],\n  verification: ['PENDING_VERIFICATION'],",
              "  upload: ['WAITING_RESULT_UPLOAD'],"
          )
          replace_once(
              server,
              "  const terminalOrLocked = ['PENDING_ACCEPT', 'PENDING_VERIFICATION', 'COMPLETED', 'ABNORMAL_CLOSED', 'PROCESSING_FAILED', 'CANCELLED']",
              "  const terminalOrLocked = ['PENDING_ACCEPT', 'COMPLETED', 'ABNORMAL_CLOSED', 'PROCESSING_FAILED', 'CANCELLED']"
          )

          # New task flow: upload result -> completed, in one transaction.
          replace_once(
              server,
              "    } else if (action === 'result') {\n      if (task.status !== 'WAITING_RESULT_UPLOAD') throw Object.assign(new Error('当前任务不能上传办理结果'), { status: 409 })\n      if (!body.identityVerified) throw Object.assign(new Error('请先确认已完成客户实名核实'), { status: 400 })\n      const resultStatus = String(body.resultStatus || 'SUCCESS')\n      if (resultStatus !== 'SUCCESS') throw Object.assign(new Error('办理失败请使用异常结束并填写失败原因'), { status: 400 })\n      const description = String(body.resultDescription || '').trim()\n      if (!description) throw Object.assign(new Error('请填写办理结果说明'), { status: 400 })\n      if (!['PROCESSING', 'VERIFICATION_RETURNED'].includes(application.status)) throw Object.assign(new Error('订单当前状态不能接收办理结果'), { status: 409 })\n      await changeTaskStatus(id, 'WAITING_RESULT_UPLOAD', 'PENDING_VERIFICATION', 'SERVICE_RESULT_UPLOADED', user, description, {}, connection, 'result_uploaded_at = NOW(3)')\n      await changeStatus(task.application_id, application.status, 'PENDING_VERIFICATION', 'FULFILLMENT_SUBMITTED', user, null, { taskId: id }, connection)\n      await connection.execute('INSERT INTO fulfillment_submissions (task_id, application_id, salesman_user_id, submitted_by_user_id, identity_verified, result_status, result_description, voucher_remark) VALUES (?, ?, ?, ?, 1, ?, ?, ?)', [id, task.application_id, user.id, user.id, resultStatus, description, description])\n",
              "    } else if (action === 'result') {\n      if (task.status !== 'WAITING_RESULT_UPLOAD') throw Object.assign(new Error('当前任务不能上传办理结果'), { status: 409 })\n      if (!body.identityVerified) throw Object.assign(new Error('请先确认已完成客户实名核实'), { status: 400 })\n      const resultStatus = String(body.resultStatus || 'SUCCESS')\n      if (resultStatus !== 'SUCCESS') throw Object.assign(new Error('办理失败请使用异常结束并填写失败原因'), { status: 400 })\n      const description = String(body.resultDescription || '').trim()\n      if (!description) throw Object.assign(new Error('请填写办理结果说明'), { status: 400 })\n      if (application.status !== 'PROCESSING') throw Object.assign(new Error('订单当前状态不能接收办理结果'), { status: 409 })\n      await connection.execute('INSERT INTO fulfillment_submissions (task_id, application_id, salesman_user_id, submitted_by_user_id, identity_verified, result_status, result_description, voucher_remark) VALUES (?, ?, ?, ?, 1, ?, ?, ?)', [id, task.application_id, user.id, user.id, resultStatus, description, description])\n      await changeTaskStatus(id, 'WAITING_RESULT_UPLOAD', 'COMPLETED', 'SERVICE_RESULT_COMPLETED', user, description, {}, connection, 'result_uploaded_at = NOW(3), completed_at = NOW(3)')\n      await changeStatus(task.application_id, 'PROCESSING', 'COMPLETED', 'FULFILLMENT_COMPLETED', user, null, { taskId: id }, connection)\n"
          )
          replace_once(
              server,
              "      if (['COMPLETED', 'PENDING_VERIFICATION', 'CANCELLED', 'ABNORMAL_CLOSED'].includes(task.status))",
              "      if (['COMPLETED', 'CANCELLED', 'ABNORMAL_CLOSED'].includes(task.status))"
          )

          # Task state machine permits direct completion.
          replace_once(
              'domain/task/status.js',
              "  WAITING_RESULT_UPLOAD: ['PENDING_VERIFICATION', 'ABNORMAL_CLOSED'],",
              "  WAITING_RESULT_UPLOAD: ['COMPLETED', 'ABNORMAL_CLOSED'],"
          )
          replace_once(
              'domain/task/status.js',
              "  PENDING_VERIFICATION: '等待客服核销', COMPLETED: '已完成', CANCELLED: '已取消',",
              "  PENDING_VERIFICATION: '历史待核销状态', COMPLETED: '已完成', CANCELLED: '已取消',"
          )

          # Salesman UI no longer exposes an auditing stage.
          replace_once(
              'modules/salesman/task-view.js',
              "  DOCUMENT_PENDING: ['WAITING_RESULT_UPLOAD', 'DOCUMENT_PENDING', 'VERIFICATION_RETURNED'],\n  AUDITING: ['PENDING_VERIFICATION', 'AUDITING'],",
              "  DOCUMENT_PENDING: ['WAITING_RESULT_UPLOAD', 'DOCUMENT_PENDING'],"
          )
          replace_once(
              'modules/salesman/task-view.js',
              "  DOCUMENT_PENDING: '待提交', AUDITING: '审核中', FINISHED: '完成', FAILED: '失败'",
              "  DOCUMENT_PENDING: '待提交', FINISHED: '完成', FAILED: '失败'"
          )
          replace_once(
              'modules/salesman/pages/home/index.js',
              "          submitting: tasks.filter(item => ['DOCUMENT_PENDING', 'AUDITING'].includes(item.salesmanStatus)).length,",
              "          submitting: tasks.filter(item => item.salesmanStatus === 'DOCUMENT_PENDING').length,"
          )
          replace_once(
              'modules/salesman/pages/tasks/index.js',
              "  { key: 'VERIFYING', label: '实名核验' }, { key: 'DOCUMENT_PENDING', label: '待提交' },\n  { key: 'AUDITING', label: '审核中' }, { key: 'FINISHED', label: '完成' }",
              "  { key: 'VERIFYING', label: '实名核验' }, { key: 'DOCUMENT_PENDING', label: '待提交' },\n  { key: 'FINISHED', label: '完成' }"
          )
          replace_once(
              'modules/salesman/pages/task-detail/index.js',
              "  const processing = ['PROCESSING', 'WAITING_RESULT_UPLOAD', 'DOCUMENT_PENDING', 'PENDING_VERIFICATION', 'AUDITING', 'COMPLETED', 'FINISHED'].includes(status)\n  const submitted = ['PENDING_VERIFICATION', 'AUDITING', 'COMPLETED', 'FINISHED'].includes(status)",
              "  const processing = ['PROCESSING', 'WAITING_RESULT_UPLOAD', 'DOCUMENT_PENDING', 'COMPLETED', 'FINISHED'].includes(status)\n  const submitted = ['COMPLETED', 'FINISHED'].includes(status)"
          )
          replace_once(
              'modules/salesman/pages/task-detail/index.js',
              "          !['PENDING_ACCEPT', 'WAIT_ASSIGN', 'TRANSFER_PENDING', 'PENDING_VERIFICATION', 'AUDITING'].includes(task.status)",
              "          !['PENDING_ACCEPT', 'WAIT_ASSIGN', 'TRANSFER_PENDING'].includes(task.status)"
          )
          replace_once(
              'modules/salesman/pages/task-detail/index.js',
              "  uploadResult() { this.run(uploadResult(this.data.id, this.data.identityVerified, this.data.resultDescription), '结果已提交') },",
              "  uploadResult() { this.run(uploadResult(this.data.id, this.data.identityVerified, this.data.resultDescription), '办理结果已提交，任务完成') },"
          )
          replace_once(
              'modules/salesman/pages/task-detail/index.wxml',
              '<button class="primary" loading="{{operating}}" bindtap="uploadResult">提交结果进入审核</button>',
              '<button class="primary" loading="{{operating}}" bindtap="uploadResult">提交办理结果并完成任务</button>'
          )
          replace_once(
              'modules/salesman/pages/task-detail/index.wxml',
              "    <view wx:if=\"{{task.status==='PENDING_VERIFICATION'||task.status==='AUDITING'}}\" class=\"notice success\">办理结果已上传，正在审核中。</view>",
              ""
          )

          # Remove obsolete client-side verification APIs and unregistered pages.
          for old in [
              "function getCustomerVerifications(category) {\n  const query = ['completed', 'rejected'].includes(category) ? `?category=${category}` : ''\n  return customerRequest(`/v1/customer/verifications${query}`).then(response => response.verifications || [])\n}\nfunction getCustomerVerification(id) {\n  return customerRequest(`/v1/customer/verifications/${id}`).then(response => response.verification)\n}\n",
              "function verifyFulfillment(id, decision, reason, customerConfirmed) { return customerRequest(`/v1/customer/applications/${id}/verify`, { decision, reason, customerConfirmed }) }\n"
          ]:
              replace_once('services/client-application-service.js', old, '')
          for old in [
              "  getCustomerVerifications,\n  getCustomerVerification,\n",
              "  verifyFulfillment,\n"
          ]:
              replace_once('services/client-application-service.js', old, '')

          for directory in [
              Path('modules/customer-service/pages/verification'),
              Path('modules/customer-service/pages/verification-detail')
          ]:
              if directory.exists():
                  shutil.rmtree(directory)

          # Migrate legacy in-progress verification records when npm run migrate is executed.
          migration_file = 'server/src/migrate.js'
          migration_function = """
          async function ensureDirectCompletionFlow() {
            await db.query("UPDATE application_tasks SET status = 'COMPLETED', completed_at = COALESCE(completed_at, result_uploaded_at, NOW(3)) WHERE status = 'PENDING_VERIFICATION'")
            await db.query("UPDATE applications SET status = 'COMPLETED' WHERE status = 'PENDING_VERIFICATION'")
            await db.query("UPDATE applications SET status = 'PROCESSING' WHERE status = 'VERIFICATION_RETURNED'")
            await db.query("UPDATE fulfillment_submissions SET verification_status = 'APPROVED', verification_reason = COALESCE(verification_reason, '客服核销流程已取消，系统自动完成'), verified_at = COALESCE(verified_at, NOW(3)) WHERE verification_status = 'PENDING'")
            await db.query("INSERT INTO schema_migrations (version) VALUES ('2026-07-23-direct-completion-without-verification') ON DUPLICATE KEY UPDATE version = VALUES(version)")
          }

          """.lstrip()
          replace_once(migration_file, 'async function run() {\n', migration_function + 'async function run() {\n')
          replace_once(
              migration_file,
              '  await ensureCustomerServiceTaskFlow()\n  console.log(\'Database migrations are up to date.\')',
              '  await ensureCustomerServiceTaskFlow()\n  await ensureDirectCompletionFlow()\n  console.log(\'Database migrations are up to date.\')'
          )

          # Remove this one-time workflow from the final branch state.
          Path('.github/workflows/apply-direct-completion.yml').unlink()
          PY

      - name: Validate JavaScript syntax
        run: |
          find . -path './server/node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remove customer-service verification flow [skip ci]"
          git push origin HEAD:Git_hub
